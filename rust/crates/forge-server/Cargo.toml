[package]
name = "forge-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
forge-core = { path = "../forge-core" }
forge-store = { path = "../forge-store" }
forge-cli = { path = "../forge-cli" }
forge-runtime.workspace = true
axum = "0.8"
async-stream = "0.3"
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
uuid.workspace = true
scrypt = "0.11"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { workspace = true, features = ["backup"] }
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
subtle = "2"
libc = "0.2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
