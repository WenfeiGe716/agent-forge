[workspace]
members = ["crates/forge-core", "crates/forge-store", "crates/forge-cli", "crates/forge-runtime", "crates/forge-server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-store = { path = "crates/forge-store" }
forge-runtime = { path = "crates/forge-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
